name: cv_generator_app
description: "Professional CV Generator App with advanced UI/UX and multi-language support"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # File Handling
  file_picker: ^5.5.0
  path_provider: ^2.0.15
  permission_handler: ^10.4.5
  image_picker: ^1.0.4
  
  # PDF & Document Processing
  pdf: ^3.10.4
  printing: ^5.11.0
  image: ^4.0.17
  
  # Network & API
  http: ^0.13.6
  dio: ^5.3.2
  
  # Storage & Preferences
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # UI Components & Animations
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  
  # Utilities
  intl: ^0.18.0
  uuid: ^3.0.7
  mime: ^1.0.4
  path: ^1.8.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/templates/
    - assets/templates/meta.json
    - assets/templates/meta-template1.json
    - assets/templates/previews/
    - assets/animations/
    - assets/icons/
    - assets/lang/

  # Fonts
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
